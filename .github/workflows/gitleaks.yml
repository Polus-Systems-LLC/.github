name: gitleaks

# Reusable check: scan the commits a PR adds for secrets with the Gitleaks
# CLI. Required by org ruleset A as "gitleaks / scan". The CLI is used directly
# because gitleaks/gitleaks-action needs a paid license for organizations.
on:
  workflow_call:

permissions: {}

env:
  GITLEAKS_VERSION: 8.30.1
  # sha256 of gitleaks_8.30.1_linux_x64.tar.gz, copied from the release's
  # gitleaks_8.30.1_checksums.txt and cross-checked against the asset digest
  # GitHub reports for the release. Bump both values together.
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  scan:
    name: scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - name: Require a pull_request event
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "::error::gitleaks scan only runs on pull_request events (got '$EVENT_NAME')."
            exit 1
          fi

      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned Gitleaks
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict -
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/gitleaks" gitleaks
          "$RUNNER_TEMP/gitleaks/gitleaks" version

      - name: Scan the PR commit range
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Exit code 1 on any finding; secrets are fully redacted in the log.
          "$RUNNER_TEMP/gitleaks/gitleaks" git \
            --log-opts "${BASE_SHA}..${HEAD_SHA}" \
            --redact \
            --verbose \
            --no-banner \
            --exit-code 1 \
            .
