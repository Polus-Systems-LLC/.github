name: pr-scans

# Runs this repo's own secret and code scans on its PRs. The job ids produce
# the required checks "gitleaks / scan" and "semgrep / scan" in org ruleset A.
# Do not rename the jobs or give them a name:, an if: or a path filter.
# Keep "edited": GitHub sends it when the PR's base branch changes, and both
# scans trust the base commit, so a retargeted PR must be scanned again. It
# also re-runs the scans on title or body edits; cancel-in-progress keeps
# only the newest run for the PR.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
  merge_group:

permissions: {}

concurrency:
  group: pr-scans-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    permissions:
      contents: read
    uses: ./.github/workflows/gitleaks.yml

  semgrep:
    permissions:
      contents: read
    uses: ./.github/workflows/semgrep.yml
