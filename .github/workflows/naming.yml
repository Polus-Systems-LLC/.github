name: naming

# Reusable check: the PR head branch and title must carry a Jira key.
# Required by org ruleset A as the status check "naming / check" (caller job
# id "naming", this job's name "check").
on:
  workflow_call:

permissions: {}

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 5
    steps:
      - name: Check branch name and PR title
        # Every event value reaches the script through env, never through
        # expression interpolation inside run, so a crafted branch name or
        # title cannot inject shell.
        env:
          EVENT_NAME: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          HEAD_REF: ${{ github.head_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "::error::naming check only runs on pull_request events (got '$EVENT_NAME')."
            exit 1
          fi

          # Bot PRs (Dependabot and other apps) cannot follow the Jira convention.
          if [ "$ACTOR" = "dependabot[bot]" ] || [[ "$HEAD_REF" == dependabot/* ]] || [ "$PR_AUTHOR_TYPE" = "Bot" ]; then
            echo "Bot pull request (actor '$ACTOR', author type '$PR_AUTHOR_TYPE'): naming check skipped."
            exit 0
          fi

          branch_re='^(feat|fix|hotfix|chore|docs|refactor|test|ci)/PLS-[0-9]+-[a-z0-9-]+$'
          title_re='^PLS-[0-9]+: .+'
          failed=0

          if [[ ! "$HEAD_REF" =~ $branch_re ]]; then
            echo "::error::Branch '$HEAD_REF' does not match <type>/PLS-<number>-<slug>. Allowed types: feat, fix, hotfix, chore, docs, refactor, test, ci. The slug uses lowercase letters, digits and hyphens. Example: feat/PLS-93-polus-infra"
            failed=1
          fi

          if [[ ! "$PR_TITLE" =~ $title_re ]]; then
            echo "::error::PR title '$PR_TITLE' does not match 'PLS-<number>: <summary>'. Example: PLS-93: Add Terraform for org rulesets"
            failed=1
          fi

          if [ "$failed" -ne 0 ]; then
            exit 1
          fi
          echo "Branch and PR title follow the naming convention."
